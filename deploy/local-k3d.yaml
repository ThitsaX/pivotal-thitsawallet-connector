# Runs the connector in the local k3d cluster so it authenticates to Vault with a
# Kubernetes ServiceAccount -- the production credential path, which the Java client
# had never executed (trust-manager step 4).
#
# Values mirror the IntelliJ run configuration, with localhost swapped for the
# Compose container names the cluster resolves via scripts/refresh-compose-dns.sh
# in the pivotal repo.
#
# NOTE: only ONE wallet2 connector may run at a time. The NATS durable consumers
# (connector-consumer-*-wallet2) are a queue group, so an IntelliJ instance and this
# pod would split messages between them non-deterministically.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connector-wallet2
  namespace: pivotal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thitsawallet-connector-wallet2
  namespace: pivotal
  labels:
    app.kubernetes.io/name: thitsawallet-connector
    app.kubernetes.io/component: connector-wallet2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: connector-wallet2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thitsawallet-connector
        app.kubernetes.io/component: connector-wallet2
    spec:
      # Vault binds its auth role to this name. A pod running as "default" could
      # authenticate as nothing.
      serviceAccountName: connector-wallet2
      containers:
        - name: connector
          image: pivotal-thitsawallet-connector:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3003
          env:
            - { name: CONNECTOR_ID,               value: "wallet2" }
            - { name: SUPPORTED_CURRENCIES,       value: "USD,LRD" }
            - { name: CONNECTOR_ILP_SECRET,       value: "test" }
            - { name: NATS_URL,                   value: "nats://nats:4222" }
            - { name: FSPIOP_STREAM_NAME,         value: "PIVOTAL_FSPIOP" }
            - { name: PIVOTAL_AUDIT_STREAM_NAME,  value: "PIVOTAL_AUDIT" }
            - { name: CONNECTOR_FORCE_PATCH_ERROR, value: "false" }
            # The connector PUTs straight to Hub services, not back through web-inbound.
            - { name: FSPIOP_PARTIES_URL,         value: "http://account-lookup-service:4002" }
            - { name: FSPIOP_QUOTES_URL,          value: "http://quoting-service:3002" }
            - { name: FSPIOP_TRANSFERS_URL,       value: "http://ml-api-adapter:3000" }
            - { name: OUTBOUND_ENDPOINT,          value: "http://web-outbound:3200" }
            - { name: FSPIOP_SWITCH_ID,           value: "hub" }
            # Host 8082 maps to the DemoWallet container's 8081.
            - { name: BACKEND_ENDPOINT,           value: "http://wallet2-demowallet:8081" }
            - { name: FEE_ENGINE_ENDPOINT,        value: "http://wallet2-demowallet:8081" }
            - { name: IS_CALCULATE_FEE,           value: "false" }
            - { name: BACKEND_API_TIMEOUT_MS,     value: "30000" }
            - { name: IS_PREFIX,                  value: "false" }
            - { name: REDIS_URL,                  value: "redis://pivotal-redis:6379" }
            - { name: REDIS_TTL_SECONDS,          value: "1200" }
            - { name: SDK_CONNECTOR_PORT_NO,      value: "3003" }
            - { name: TRANSACTION_AMOUNT_LIMIT,   value: "0" }
            # FSPIOP JWS. No key material here -- the connector reads its own tenant's
            # key from Vault over Kubernetes ServiceAccount auth, once at startup.
            - { name: FSPIOP_USE_JWS,             value: "true" }
            - { name: VAULT_URL,                  value: "http://vault.vault.svc.cluster.local:8200" }
            - { name: VAULT_ROLE,                 value: "connector-wallet2" }
            - { name: VAULT_KUBERNETES_AUTH_PATH, value: "kubernetes" }
            - { name: VAULT_KV_MOUNT,             value: "secret" }
            - { name: VAULT_JWS_KEY_PATH_PREFIX,  value: "pivotal/jwskey" }
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits:   { memory: "1Gi" }
